# AWS Amplify Hosting build spec (PRD Section 5.4).
# Connect this repository in the Amplify console and set the environment
# variable VITE_API_BASE_URL to the API Gateway stage URL that
# scripts/deploy.sh prints.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
